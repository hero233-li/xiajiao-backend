openapi: 3.0.3
info:
  title: 学习知途 REST API
  version: 0.1.0-review
  description: |-
    阶段3接口契约评审稿；基于已确认的React18/Java21/Spring Boot3/MySQL/Flyway设计，只交付文档。所有UUID、时间、分数、内容和令牌示例均为虚构，不代表线上导出或已运行接口。
    成功统一code=0/data/message=ok；失败非0/data=null/中文message，HTTP状态同时表达错误。DELETE成功使用200与JSON而非204。所有文件下载也采用JSON+Base64以严格满足统一响应，不使用二进制成功例外；后续若需流式下载须单独确认契约变更。
    分页data固定items/page/size/total，page从1开始，size 1–100；列表按接口描述稳定排序，未声明的默认按ID升序。日期业务为Asia/Shanghai，事件UTC RFC3339；月份YYYY-MM，代码字符串保留零。multipart示例中file是二进制文件占位，真实调用必须上传文件本体，不能上传该占位字符串。只有Idempotency-Key明确列出的练习提交/检测申请保证相同用户相同键和正文重放原结果；其余写入使用绝对状态/修订号或资源终态约束。
    JWT Bearer；身份由认证取，不接受客户端owner/userId。ADMIN兼学习身份，但答案管理入口独立，学习取题接口始终无答案。前端不包含标准答案/受控PDF；组件经统一api层调用。密码/令牌/文件内容/标准答案不入日志，私有响应Cache-Control:no-store。
    同一Dashboard响应由后端一致性快照生成，所有页面共用Progress。目录勾选返回新状态、最新课程与总进度及关联计划；客户端按revision/clientMutationId对齐，刷新聚合，不自行拼总进度、预测、门槛或解锁。
    已确认：作废最后有效模拟通过且无其他来源立即关闭真题/成绩写入；旧练习经审核认领按原创ID联合去重计门槛；今日建议采用今天首个未完成计划任务，无任务显示暂无今日安排。未指定planId时取同周期最近创建的计划及当前确认版本；已支持显式planId。每个示例为独立场景，不能当成同一次完整用户会话重放。认证输入规范化/JWT寿命/部署存储参数未硬编码，登录原值策略沿用当前设计，不自作大小写转换。沿用关闭公开注册，注册范围待确认；基础认证已实现刷新，新增本地Codex答卷批改；不开放补题/快捷模块。
    阶段4只实现健康和认证基础接口，业务模块仍为契约。新增/auth/register（默认关闭）、/auth/refresh及/health；认证字段按本阶段实现同步，登录寿命示例15分钟。
servers:
  - url: /api/v1
    description: 同源反向代理前缀；开发部署地址另行配置
tags:
  - name: auth
    description: 登录、当前身份和退出
  - name: courses
    description: 六科、报名、正式成绩与最近学习位置
  - name: catalog
    description: 目录、知识合集、例题、实践手册及管理员内容
  - name: practice
    description: 练习、标记、统计、能力检测、通过及题库管理
  - name: exams
    description: 考试周期、真题权限、成绩预测、附件与旧历史
  - name: schedule
    description: 计划、快照、目录同步、一键顺延预览确认
  - name: notes
    description: 学习备注和标签
  - name: dashboard
    description: 首页统一聚合及管理审计
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: 用户名或邮箱登录
      description: |-
        初始化本人ADMIN；关闭注册。对密码错误和不存在账号给同一错误，不泄漏账号存在性。
        公开登录入口；禁止公开注册。 阶段4已实现：标识按原值区分，不自动trim/大小写转换；账号不存在、密码错误或停用均返回40102，避免登录时泄漏账号状态。
      parameters: []
      responses:
        "200":
          description: 成功；统一JSON封装
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                code: 0
                data:
                  accessToken: eyJhbGciOiJ...示例...
                  tokenType: Bearer
                  expiresAt: 2026-10-02T02:15:00Z
                  user:
                    id: 6184a068-308c-5f8e-b4e1-4ec629bb6a24
                    username: 我的账号
                    email: owner@example.invalid
                    role: ADMIN
                  refreshToken: eyJhbGciOiJ...刷新示例...
                  refreshExpiresAt: 2026-10-09T02:00:00Z
                message: ok
        "400":
          $ref: "#/components/responses/Error400_40001"
        "401":
          description: 40102 用户名/邮箱或密码错误；40103 账号已禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                "40102":
                  summary: 用户名/邮箱或密码错误
                  value:
                    code: 40102
                    data: null
                    message: 用户名/邮箱或密码错误
        "429":
          $ref: "#/components/responses/Error429_42901"
        "500":
          $ref: "#/components/responses/Error500_50001"
      x-request-example:
        method: POST
        path: /api/v1/auth/login
        query: {}
        headers:
          Content-Type: application/json
        body:
          identifier: owner@example.invalid
          password: 仅用于文档的示例密码
      x-error-codes:
        - code: 40001
          httpStatus: 400
          message: 请求参数/JSON字段不合法
        - code: 40102
          httpStatus: 401
          message: 用户名/邮箱或密码错误
        - code: 40103
          httpStatus: 401
          message: 账号已禁用
        - code: 42901
          httpStatus: 429
          message: 请求过于频繁，请稍后重试
        - code: 50001
          httpStatus: 500
          message: 服务暂时不可用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              identifier: owner@example.invalid
              password: 仅用于文档的示例密码
      security: []
  /auth/me:
    get:
      tags:
        - auth
      operationId: getCurrentUser
      summary: 读取当前账号
      description: 本人数据，身份来自JWT。
      parameters: []
      responses:
        "200":
          description: 成功；统一JSON封装
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentUserResponse"
              example:
                code: 0
                data:
                  id: 6184a068-308c-5f8e-b4e1-4ec629bb6a24
                  username: 我的账号
                  email: owner@example.invalid
                  role: ADMIN
                message: ok
        "400":
          $ref: "#/components/responses/Error400_40001"
        "401":
          $ref: "#/components/responses/Error401_40101"
        "403":
          $ref: "#/components/responses/Error403_40301"
        "404":
          $ref: "#/components/responses/Error404_40401"
        "429":
          $ref: "#/components/responses/Error429_42901"
        "500":
          $ref: "#/components/responses/Error500_50001"
      x-request-example:
        method: GET
        path: /api/v1/auth/me
        query: {}
        headers:
          Authorization: Bearer <登录返回的accessToken>
        body: null
      x-error-codes:
        - code: 40001
          httpStatus: 400
          message: 请求参数/JSON字段不合法
        - code: 40101
          httpStatus: 401
          message: 未登录或令牌无效/过期
        - code: 40301
          httpStatus: 403
          message: 角色不足或无权访问
        - code: 40401
          httpStatus: 404
          message: 资源不存在或不属于当前用户
        - code: 42901
          httpStatus: 429
          message: 请求过于频繁，请稍后重试
        - code: 50001
          httpStatus: 500
          message: 服务暂时不可用
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: 退出当前账号的全部登录会话
      description: |-
        token_version递增，撤销当前账号所有已签发JWT；客户端同时清理私有缓存。首版没有独立令牌会话表，不能声称仅退出这一设备。
        本人数据，身份来自JWT。
      parameters: []
      responses:
        "200":
          description: 成功；统一JSON封装
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
              example:
                code: 0
                data: null
                message: ok
        "400":
          $ref: "#/components/responses/Error400_40001"
        "401":
          $ref: "#/components/responses/Error401_40101"
        "403":
          $ref: "#/components/responses/Error403_40301"
        "404":
          $ref: "#/components/responses/Error404_40401"
        "429":
          $ref: "#/components/responses/Error429_42901"
        "500":
          $ref: "#/components/responses/Error500_50001"
      x-request-example:
        method: POST
        path: /api/v1/auth/logout
        query: {}
        headers:
          Authorization: Bearer <登录返回的accessToken>
        body: null
      x-error-codes:
        - code: 40001
          httpStatus: 400
          message: 请求参数/JSON字段不合法
        - code: 40101
          httpStatus: 401
          message: 未登录或令牌无效/过期
        - code: 40301
          httpStatus: 403
          message: 角色不足或无权访问
        - code: 40401
          httpStatus: 404
          message: 资源不存在或不属于当前用户
        - code: 42901
          httpStatus: 429
          message: 请求过于频繁，请稍后重试
        - code: 50001
          httpStatus: 500
          message: 服务暂时不可用
  /dashboard:
    get:
      tags:
        - dashboard
      operationId: getDashboard
      summary: 首页与备考总览聚合
      description: |-
        一个请求返回继续学习位置、今日建议、总进度、倒计时及课程卡片。同一后端一致性快照，所有页面使用当前六科发布目录按条目汇总的进度，课程/搜索筛选和周期不改变分母。最近位置按updatedAt倒序/课程ID取首条。今日建议取今日计划首个未完成任务，按sortOrder/segmentId排序；没有时todaySuggestion=NULL且todaySuggestionMessage=暂无今日安排。未指定planId时，取本人该周期按createdAt、ID倒序的首份计划及其当前确认版本；显式planId须属于本人及该周期。没有计划或今天无未完成安排时建议NULL并显示暂无今日安排。
        本人数据，身份来自JWT。
      parameters:
        - name: cycleId
          in: query
          required: true
          description: 稳定UUID
          schema:
            type: string
            description: 稳定UUID
            format: uuid
            example: 0ebdbbfe-d607-54b5-9c21-4e0adade5e4c
          example: 0ebdbbfe-d607-54b5-9c21-4e0adade5e4c
        - name: planId
          in: query
          required: false
          description: 稳定UUID
          schema:
            type: string
            description: 稳定UUID
            format: uuid
            example: 54b35478-256c-571c-8b9e-e41dd4c638f6
          example: 54b35478-256c-571c-8b9e-e41dd4c638f6
      responses:
