  D1_INVALIDATE_LAST_MOCK: 立即关闭真题/成绩写入；其他有效pass/override仍可授权。
  D2_LEGACY_GATE_CREDIT: 本人ADMIN审核认领后按原创ID与新记录联合去重计入。
  D3_TODAY_SUGGESTION: 今天计划首个未完成任务；没有则显示暂无今日安排。
  D4_MULTIPLE_PLANS: 未指定planId时取同周期最近创建的计划及当前确认版本。
